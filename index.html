<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>The Threshold Study — Two Buttons. One Choice.</title>
    <meta
      name="description"
      content="Two buttons. One choice. What would you press? An anonymous coordination experiment — 60 seconds, no signup. See how the world answers."
    />

    <!-- Open Graph / Twitter card. /og.png is a Pages Function that renders
         the card server-side and reflects the live response count + lifecycle.
         Absolute URLs are required: relative `/og.png` is not reliably resolved
         by iMessage, Slack, LinkedIn, and some Twitter scrapers. -->
    <meta property="og:title" content="The Threshold Study — Two Buttons. One Choice." />
    <meta
      property="og:description"
      content="Two buttons. One choice. What would you press? An anonymous coordination experiment — 60 seconds, no signup. See how the world answers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mayliveforever.com/" />
    <meta property="og:site_name" content="The Threshold Study" />
    <meta property="og:image" content="https://mayliveforever.com/og.png" />
    <meta property="og:image:secure_url" content="https://mayliveforever.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Threshold Study — two buttons, one choice. An anonymous coordination experiment."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Threshold Study — Two Buttons. One Choice." />
    <meta
      name="twitter:description"
      content="Two buttons. One choice. What would you press? An anonymous coordination experiment — 60 seconds, no signup. See how the world answers."
    />
    <meta name="twitter:image" content="https://mayliveforever.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="The Threshold Study — two buttons, one choice. An anonymous coordination experiment."
    />
